<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="google617c8e2be1dc4334" />
    <meta name="google-site-verification" content="google617c8e2be1dc4334.html" />

    <!-- Agentic Browsing & AI Discovery (Lighthouse 13.3+ Specification) -->
    <link rel="alternate" type="text/markdown" href="/llms.txt" title="LLMs.txt" />
    <link rel="model-context" href="/.well-known/webmcp.json" />

    <!-- Search Engine Indexing (Robots) -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://shoplink-beta.vercel.app/" />
    <meta property="og:site_name" content="ShopLink" />
    <meta property="og:title" content="ShopLink – Curated Creator Deals & Product Showcase" />
    <meta property="og:description" content="Discover handpicked creator deals, verified discounts, and direct affiliate links across Amazon, Flipkart, Meesho, and Myntra on ShopLink." />
    <meta property="og:image" content="https://shoplink-beta.vercel.app/assets/images/bg_dark_theme_1790694471314.jpg" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://shoplink-beta.vercel.app/" />
    <meta name="twitter:title" content="ShopLink – Curated Creator Deals & Product Showcase" />
    <meta name="twitter:description" content="Discover handpicked creator deals, verified discounts, and direct affiliate links across Amazon, Flipkart, Meesho, and Myntra on ShopLink." />
    <meta name="twitter:image" content="https://shoplink-beta.vercel.app/assets/images/bg_dark_theme_1790694471314.jpg" />

    <!-- Schema.org Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://shoplink-beta.vercel.app/#website",
          "url": "https://shoplink-beta.vercel.app/",
          "name": "ShopLink",
          "description": "Curated creator deals and verified affiliate product showcase.",
          "inLanguage": "en-US",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://shoplink-beta.vercel.app/?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "CollectionPage",
          "@id": "https://shoplink-beta.vercel.app/#webpage",
          "url": "https://shoplink-beta.vercel.app/",
          "name": "ShopLink – Curated Creator Deals & Product Showcase",
          "isPartOf": {
            "@id": "https://shoplink-beta.vercel.app/#website"
          },
          "description": "Discover handpicked creator deals, verified discounts, and direct affiliate links across Amazon, Flipkart, Meesho, and Myntra.",
          "inLanguage": "en-US"
        }
      ]
    }
    </script>

    <!-- WebMCP (Web Model Context Protocol) Registration for AI Agents & Lighthouse -->
    <script>
      (function() {
        var searchTool = {
          name: "search_products",
          description: "Search curated creator deals and products by keyword, category, or marketplace platform",
          parameters: {
            type: "object",
            properties: {
              query: { type: "string", description: "Search keyword for product title, brand, or tag" },
              category: { type: "string", description: "Category filter (e.g., Tech, Fashion, Ethnic, Skincare, Home)" },
              platform: { type: "string", description: "Platform filter (Amazon, Flipkart, Meesho, Myntra)" }
            }
          }
        };
        var getDealsTool = {
          name: "get_featured_deals",
          description: "Retrieve handpicked creator deals, verified discounts, and direct affiliate product links",
          parameters: {
            type: "object",
            properties: {
              sortBy: { type: "string", enum: ["featured", "popular", "newest", "price-low", "price-high"], description: "Sort order" }
            }
          }
        };
        var tools = [searchTool, getDealsTool];
        if (!document.modelContext) {
          document.modelContext = {
            tools: tools,
            registerTool: function(tool) {
              if (tool && tool.name) {
                this.tools = this.tools.filter(function(t) { return t.name !== tool.name; });
                this.tools.push(tool);
              }
            },
            getTools: function() { return this.tools; }
          };
        } else if (typeof document.modelContext.registerTool === 'function') {
          try {
            document.modelContext.registerTool(searchTool);
            document.modelContext.registerTool(getDealsTool);
          } catch(e) {}
        }
        if (!window.modelContext) {
          window.modelContext = document.modelContext;
        }
      })();
    </script>

    <!-- GitHub Pages subpath trailing slash normalization -->
    <script>
      (function() {
        var path = window.location.pathname;
        if (path && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>

    <!-- Global error shield against white screens -->
    <script>
      window.addEventListener('error', function(e) {
        console.warn('Unhandled runtime notice:', e.message);
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && (!root.innerHTML || root.innerHTML.trim() === '')) {
            root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#f8fafc;font-family:sans-serif;color:#0f172a;text-align:center;">' +
              '<div style="max-width:440px;margin:auto;background:white;padding:32px;border-radius:16px;border:1px solid #e2e8f0;box-shadow:0 4px 6px -1px rgba(0,0,0,0.05);">' +
                '<h2 style="font-size:18px;font-weight:700;margin:0 0 8px;">ShopLink Showcase</h2>' +
                '<p style="font-size:13px;color:#64748b;margin:0 0 20px;line-height:1.5;">Welcome to the affiliate store. Click below to load products.</p>' +
                '<button onclick="localStorage.clear();location.reload();" style="width:100%;padding:10px 16px;background:#0f172a;color:white;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;">Load Showcase</button>' +
              '</div>' +
            '</div>';
          }
        }, 1200);
      });
    </script>

    <!-- Optimized Non-Blocking Google Fonts Loading (Improves FCP & LCP) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
